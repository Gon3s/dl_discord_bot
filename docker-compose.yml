services:
  backend:
    image: ghcr.io/gon3s/dl-discord-bot-backend:latest
    ports:
      - "8765:8000"
    environment:
      # Chromium installé dans l'image
      SELENIUM_BINARY_LOCATION: /usr/bin/chromium
      # Base de données dans un volume dédié (séparé du code applicatif)
      DATABASE_URL: sqlite+aiosqlite:////app/data/dl_bot.db
    volumes:
      - media:/data/media
      - backend_db:/app/data
    restart: unless-stopped

  bot:
    image: ghcr.io/gon3s/dl-discord-bot-bot:latest
    environment:
      # Résolution interne Docker — remplace http://localhost:8000 du .env
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  media:
    driver: local
  backend_db:
    driver: local
