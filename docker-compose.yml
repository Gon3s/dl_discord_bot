services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Surcharges fixes — les autres vars sont injectées via Portainer ou .env local
      SELENIUM_BINARY_LOCATION: /usr/bin/chromium
      DATABASE_URL: sqlite+aiosqlite:////app/data/dl_bot.db
    volumes:
      - media:/data/media
      - backend_db:/app/data
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  media:
    driver: local
  backend_db:
    driver: local
