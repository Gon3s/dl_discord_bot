services:
  backend:
    image: ghcr.io/gon3s/dl-discord-bot-backend:latest
    ports:
      - "8765:8000"
    environment:
      SELENIUM_BINARY_LOCATION: /usr/bin/chromium
      DATABASE_URL: sqlite+aiosqlite:////app/data/dl_bot.db
      DEBRID_PROVIDER: ${DEBRID_PROVIDER:-alldebrid}
      ALLDEBRID_API_KEY: ${ALLDEBRID_API_KEY:-}
      REALDEBRID_API_TOKEN: ${REALDEBRID_API_TOKEN:-}
      DOWNLOAD_PATH: ${DOWNLOAD_PATH:-/data/media}
      WAWACITY_URL: ${WAWACITY_URL:-https://www.wawacity.city/}
      MAX_CONCURRENT_DOWNLOADS: ${MAX_CONCURRENT_DOWNLOADS:-2}
      BOT_NOTIFY_URL: ${BOT_NOTIFY_URL:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
    volumes:
      - media:/data/media
      - backend_db:/app/data
    shm_size: '2gb'
    restart: unless-stopped

  bot:
    image: ghcr.io/gon3s/dl-discord-bot-bot:latest
    environment:
      BACKEND_URL: http://backend:8000
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_GUILD: ${DISCORD_GUILD:-}
    depends_on:
      - backend
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  media:
    driver: local
  backend_db:
    driver: local
