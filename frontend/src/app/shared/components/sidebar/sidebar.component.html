<aside class="fixed top-0 left-0 h-screen w-52 flex flex-col z-20"
       style="background:#0a0a0a;border-right:1px solid #1a1f10">

  <!-- Logo -->
  <div class="px-4 py-5" style="border-bottom:1px solid #1a1f10">
    <div class="flex items-center gap-3">
      <div class="w-7 h-7 rounded flex items-center justify-center text-black font-black text-xs"
           style="background:var(--lime)">DL</div>
      <div>
        <p class="text-xs font-black tracking-widest uppercase" style="color:#e8ecd8">MediaBot</p>
        <p class="text-[9px] tracking-wider" style="color:#3a4022">v2.0.0</p>
      </div>
    </div>
  </div>

  <!-- Nav -->
  <nav class="flex-1 px-2 py-4 space-y-0.5 text-xs">

    <a routerLink="/search" routerLinkActive="nav-active"
       class="nav-link flex items-center gap-2.5 px-3 py-2 rounded-r">
      <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z"/>
      </svg>
      SEARCH
    </a>

    <a routerLink="/downloads" routerLinkActive="nav-active"
       class="nav-link flex items-center gap-2.5 px-3 py-2 rounded-r">
      <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
      </svg>
      DOWNLOADS
      @if (activeCount() > 0) {
        <span class="ml-auto text-[9px] px-1.5 py-0.5 rounded font-black"
              style="background:var(--lime);color:#000">{{ activeCount() }}</span>
      }
    </a>

    <a routerLink="/history" routerLinkActive="nav-active"
       class="nav-link flex items-center gap-2.5 px-3 py-2 rounded-r">
      <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      HISTORY
    </a>

    <a routerLink="/settings" routerLinkActive="nav-active"
       class="nav-link flex items-center gap-2.5 px-3 py-2 rounded-r">
      <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
      SETTINGS
    </a>

  </nav>

  <!-- Status bar -->
  <div class="px-4 py-3 flex items-center gap-2" style="border-top:1px solid #1a1f10">
    <span class="w-1.5 h-1.5 rounded-full"
          [style.background]="wsLive() ? 'var(--lime)' : (apiOnline() ? 'var(--mid)' : '#3a4022')"
          [style.animation]="wsLive() ? 'ws-pulse 1.1s ease infinite' : 'none'"></span>
    <span class="text-[9px] tracking-widest" style="color:#4a5a2a">
      {{ wsLive() ? 'WS LIVE' : (apiOnline() ? 'API ONLINE' : 'OFFLINE') }}
    </span>
  </div>

</aside>

<style>
  .nav-link { color: #6b7a4a; border-left: 2px solid transparent; transition: all .15s; }
  .nav-link:hover { color: #c8d890; background: rgba(167,209,41,.06); border-left-color: var(--mid); }
  .nav-active { color: var(--lime) !important; background: rgba(167,209,41,.1) !important; border-left: 2px solid var(--lime) !important; }
</style>
